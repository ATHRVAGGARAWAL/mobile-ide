packages:
  - packages/*
  - apps/*

# Expo/React Native need a flat node_modules
nodeLinker: hoisted
shamefullyHoist: true

allowBuilds:
  esbuild: true
  '@lydell/node-pty': true
  node-pty: true
  better-sqlite3: true
  sharp: true
  '@parcel/watcher': true
  '@vscode/ripgrep': true
  core-js: true
  core-js-pure: true
  '@expo/cli': true
  expo: true
  react-native: true
  protobufjs: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: true
  '@swc/core': true
  '@tailwindcss/oxide': true
  lightningcss: true
  canvas: true
